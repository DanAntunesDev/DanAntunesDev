name: Update contribution graph

"on":
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - scripts/fetch_contributions.py
      - scripts/render_heatmap_svg.py
      - scripts/profile_config.py
      - .github/workflows/update-heatmap.yml

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_contributions.py
      - run: python scripts/render_heatmap_svg.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
