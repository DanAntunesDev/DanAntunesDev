name: Update portrait

"on":
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - scripts/make_portrait.py
      - scripts/make_hero.py
      - scripts/design.py
      - scripts/requirements-portrait.txt
      - .github/workflows/update-portrait.yml

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  portrait:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt -r scripts/requirements-portrait.txt
      - run: python scripts/make_portrait.py
        env:
          REFRESH_AVATAR: "1"
      - run: python scripts/make_hero.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate portrait [skip ci]"
          file_pattern: "assets/avatar.png data/portrait.txt hero.svg"
